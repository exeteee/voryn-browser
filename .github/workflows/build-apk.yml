
name: Build Voryn Browser APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Extract and locate project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=( ./*.zip )

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP archive in repository root."
            exit 1
          fi

          mkdir -p source
          unzip -q "${archives[0]}" -d source

          mapfile -t settings_files < <(
            find source -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' -print
          )

          if [ "${#settings_files[@]}" -ne 1 ]; then
            echo "Expected exactly one Gradle settings file."
            exit 1
          fi

          project_dir="$(dirname "${settings_files[0]}")"

          if [ ! -f "$project_dir/app/build.gradle" ] && [ ! -f "$project_dir/app/build.gradle.kts" ]; then
            echo "Android app module build file is missing."
            exit 1
          fi

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Project: $project_dir"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voryn-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
